<link rel="stylesheet" href="../css/bootstrap.css">

    </div>
        <div class="card-2">

            <input type="file" class="form-control-file" name="img-2"  alt="imgage">
        </div>
        <div class="form-group">
            <label for="">صورة المنتج</label>
            <input type="file" class="form-control-file" name="img-3" alt="imgage">

        </div>
        <div class="card-1 col-md-10 mt-2 mr-5">

    </div>
        </form>
    </div>
</div>
